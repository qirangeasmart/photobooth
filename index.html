<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qie Photobooth Premium v2</title>
<style>
:root{
 --bg:#fff6b8;
 --pink:#ff7eb6;
 --card:#fffdf8;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 min-height:100vh;
 background:
 radial-gradient(circle at 20px 20px,#ff9cc8 8px,transparent 9px),
 radial-gradient(circle at 80px 80px,#ff9cc8 8px,transparent 9px),
 var(--bg);
 background-size:100px 100px;
 display:flex;
 justify-content:center;
 padding:20px;
}
.wrap{
 width:min(1100px,100%);
 background:rgba(255,255,255,.75);
 backdrop-filter:blur(8px);
 border-radius:28px;
 padding:20px;
 box-shadow:0 10px 30px rgba(0,0,0,.15);
}
h1{text-align:center;color:#ff4f97}
.controls{
 display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:15px;
}
button,select{
 border:none;border-radius:999px;padding:12px 18px;font-weight:bold;
}
button{cursor:pointer}
video{
 width:100%;max-width:650px;border-radius:20px;
 transform:scaleX(-1);
 display:block;margin:auto;
}
.center{text-align:center}
#countdown{font-size:64px;font-weight:bold;color:#ff4f97}
.frame-preview{
 width:48px;height:70px;border-radius:8px;display:inline-block;margin:3px;border:2px solid #ddd;
}
canvas{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>📸 Say Cheese! ✨</h1>

<div class="controls">
<select id="frame">
<option value="white">White</option>
<option value="black">Black</option>
<option value="maroon">Maroon</option>
<option value="yellow">Pastel Yellow</option>
<option value="dots">Black Polkadot</option>
</select>

<button id="flashBtn">Flash: OFF</button>
<button id="startBtn">Start Session</button>
<button id="downloadBtn" disabled>Download Strip</button>
</div>

<video id="video" autoplay playsinline></video>
<div id="countdown" class="center"></div>

<canvas id="capture"></canvas>
<canvas id="result"></canvas>
</div>

<script>
const video=document.getElementById('video');
const capture=document.getElementById('capture');
const result=document.getElementById('result');
const ctxCap=capture.getContext('2d');
const ctxRes=result.getContext('2d');

let photos=[];
let flash=false;

document.getElementById('flashBtn').onclick=()=>{
 flash=!flash;
 document.getElementById('flashBtn').textContent="Flash: "+(flash?"ON":"OFF");
};

navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}})
.then(stream=>video.srcObject=stream);

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

async function startSession(){
 photos=[];

 for(let i=0;i<4;i++){
   for(let c=3;c>=1;c--){
     countdown.textContent=c;
     await sleep(1000);
   }
   countdown.textContent="📸";

   if(flash){
      const f=document.createElement("div");
      f.style.cssText="position:fixed;inset:0;background:white;z-index:9999";
      document.body.appendChild(f);
      setTimeout(()=>f.remove(),120);
   }

   capture.width=video.videoWidth;
   capture.height=video.videoHeight;

   ctxCap.save();
   ctxCap.scale(-1,1);
   ctxCap.drawImage(video,-capture.width,0,capture.width,capture.height);
   ctxCap.restore();

   photos.push(capture.toDataURL("image/png"));
   await sleep(600);
 }

 countdown.textContent="Done ✨";
 makeStrip();
}

function frameColor(){
 const v=document.getElementById("frame").value;
 if(v==="white") return "#fff";
 if(v==="black") return "#111";
 if(v==="maroon") return "#6b1022";
 if(v==="yellow") return "#fff1a8";
 return "dots";
}

function makeStrip(){
 const W=1000,H=1400;
 result.width=W;
 result.height=H;

 const frame=frameColor();

 if(frame==="dots"){
   ctxRes.fillStyle="#111";
   ctxRes.fillRect(0,0,W,H);
   ctxRes.fillStyle="#fff";
   for(let x=25;x<W;x+=50){
    for(let y=25;y<H;y+=50){
      ctxRes.beginPath();
      ctxRes.arc(x,y,6,0,Math.PI*2);
      ctxRes.fill();
    }
   }
 }else{
   ctxRes.fillStyle=frame;
   ctxRes.fillRect(0,0,W,H);
 }

 let loaded=0;
 const imgs=[];

 photos.forEach((src,i)=>{
   const img=new Image();
   img.onload=()=>{
      imgs[i]=img;
      loaded++;
      if(loaded===4){
        const pos=[
         [70,110],[520,110],
         [70,700],[520,700]
        ];

        pos.forEach((p,j)=>{
          ctxRes.drawImage(imgs[j],p[0],p[1],400,500);
        });

        ctxRes.fillStyle="#ff5f9e";
        ctxRes.font="bold 42px Arial";
        ctxRes.textAlign="center";
        ctxRes.fillText("qiephotobooth",W/2,H-50);

        document.getElementById("downloadBtn").disabled=false;
      }
   };
   img.src=src;
 });
}

document.getElementById('startBtn').onclick=startSession;

document.getElementById('downloadBtn').onclick=()=>{
 const a=document.createElement("a");
 a.href=result.toDataURL("image/png");
 a.download="qiephotobooth-premium.png";
 a.click();
};
</script>
</body>
</html>
