<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Qie Photobooth</title>

<link href="https://fonts.googleapis.com/css2?family=Chewy&family=Patrick+Hand&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Patrick Hand',cursive;
min-height:100vh;
overflow-x:hidden;

background:
radial-gradient(circle,#ff7eb6 4px,transparent 4px),
#FFF5B8;

background-size:40px 40px;
}

.header{
text-align:center;
padding:20px;
}

.header h1{
font-family:'Chewy',cursive;
font-size:3rem;
color:#ff4fa3;
letter-spacing:3px;
text-shadow:
3px 3px 0 white,
5px 5px 0 rgba(0,0,0,.1);
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
display:flex;
gap:30px;
flex-wrap:wrap;
justify-content:center;
align-items:flex-start;
}

.left-panel{
width:420px;
max-width:95vw;
}

.camera-box{
position:relative;
border-radius:25px;
overflow:hidden;
background:white;
box-shadow:
0 15px 40px rgba(0,0,0,.15);
}

video{
width:100%;
aspect-ratio:4/3;
object-fit:cover;
transform:scaleX(-1);
display:block;
}

.flash{
position:absolute;
inset:0;
background:white;
opacity:0;
pointer-events:none;
}

.flash.active{
animation:flashAnim .4s;
}

@keyframes flashAnim{
0%{opacity:1;}
100%{opacity:0;}
}

.countdown{
position:absolute;
inset:0;
display:flex;
justify-content:center;
align-items:center;
font-size:120px;
font-weight:bold;
color:white;
text-shadow:0 0 20px black;
pointer-events:none;
}

.controls{
margin-top:15px;
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

button{
border:none;
cursor:pointer;
padding:12px 18px;
border-radius:15px;
font-size:18px;
font-family:'Patrick Hand';
transition:.2s;
}

button:hover{
transform:translateY(-2px);
}

.capture-btn{
background:#ff5ca8;
color:white;
}

.retake-btn{
background:#444;
color:white;
}

.download-btn{
background:#58c472;
color:white;
}

.flash-btn{
background:#ffd84d;
}

.right-panel{
width:350px;
max-width:95vw;
}

.section-title{
font-size:1.4rem;
margin-bottom:10px;
}

.frame-options{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
}

.frame-card{
cursor:pointer;
border-radius:15px;
overflow:hidden;
border:4px solid transparent;
background:white;
transition:.25s;
}

.frame-card.active{
border-color:#ff4fa3;
}

.thumb{
height:110px;
display:flex;
justify-content:center;
align-items:center;
}

.thumb-preview{
width:70px;
height:95px;
display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr;
gap:3px;
padding:6px;
}

.thumb-preview div{
background:#ddd;
}

.label{
text-align:center;
padding:8px;
font-size:17px;
}

.preview-grid{
margin-top:20px;
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
}

.preview-slot{
background:white;
border-radius:15px;
overflow:hidden;
aspect-ratio:4/3;
display:flex;
justify-content:center;
align-items:center;
font-size:40px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.preview-slot img{
width:100%;
height:100%;
object-fit:cover;
}

canvas{
display:none;
}

.shutter{
position:fixed;
inset:0;
background:black;
opacity:0;
pointer-events:none;
}

.shutter.active{
animation:shutterAnim .25s;
}

@keyframes shutterAnim{
0%{opacity:0;}
50%{opacity:1;}
100%{opacity:0;}
}

@media(max-width:900px){

.container{
flex-direction:column;
align-items:center;
}

.left-panel{
width:100%;
}

.right-panel{
width:100%;
}

}

.white-frame{
background:white;
}

.black-frame{
background:black;
}

.maroon-frame{
background:#5c0f24;
}

.yellow-frame{
background:#fff4a3;
}

.polkadot-frame{
background:
radial-gradient(circle,#fff 3px,transparent 3px),
#111;
background-size:18px 18px;
}

</style>
</head>

<body>

<div class="header">
<h1>SAY CHEESE ✨</h1>
</div>

<div class="container">

<div class="left-panel">

<div class="camera-box">

<video id="video" autoplay playsinline></video>

<div id="flash" class="flash"></div>

<div id="countdown" class="countdown"></div>

</div>

<div class="controls">

<button class="capture-btn" id="startBtn">
📸 Start Booth
</button>

<button class="retake-btn" id="retakeAll">
🔄 Retake All
</button>

<button class="flash-btn" id="flashToggle">
⚡ Flash ON
</button>

<button class="download-btn" id="downloadBtn">
⬇ Download
</button>

</div>

</div>

<div class="right-panel">

<h2 class="section-title">
🎨 Choose Frame
</h2>

<div class="frame-options">

<div class="frame-card active" data-frame="white">
<div class="thumb white-frame">
<div class="thumb-preview">
<div></div><div></div>
<div></div><div></div>
</div>
</div>
<div class="label">White</div>
</div>

<div class="frame-card" data-frame="black">
<div class="thumb black-frame">
<div class="thumb-preview">
<div></div><div></div>
<div></div><div></div>
</div>
</div>
<div class="label">Black</div>
</div>

<div class="frame-card" data-frame="maroon">
<div class="thumb maroon-frame">
<div class="thumb-preview">
<div></div><div></div>
<div></div><div></div>
</div>
</div>
<div class="label">Maroon</div>
</div>

<div class="frame-card" data-frame="yellow">
<div class="thumb yellow-frame">
<div class="thumb-preview">
<div></div><div></div>
<div></div><div></div>
</div>
</div>
<div class="label">Pastel Yellow</div>
</div>

<div class="frame-card" data-frame="polkadot">
<div class="thumb polkadot-frame">
<div class="thumb-preview">
<div></div><div></div>
<div></div><div></div>
</div>
</div>
<div class="label">Black Polkadot</div>
</div>

</div>

<h2 style="margin-top:25px;">
🖼 Preview Frames
</h2>

<div class="preview-grid">

<div class="preview-slot" id="slot0">1</div>

<div class="preview-slot" id="slot1">2</div>

<div class="preview-slot" id="slot2">3</div>

<div class="preview-slot" id="slot3">4</div>

</div>

</div>

</div>

<div class="shutter" id="shutter"></div>

<canvas id="captureCanvas"></canvas>
<canvas id="finalCanvas"></canvas>

<script>
   
const video = document.getElementById("video");
const countdown = document.getElementById("countdown");
const flash = document.getElementById("flash");
const shutter = document.getElementById("shutter");

const startBtn = document.getElementById("startBtn");
const flashToggle = document.getElementById("flashToggle");
const retakeAll = document.getElementById("retakeAll");

const canvas = document.getElementById("captureCanvas");
const ctx = canvas.getContext("2d");

let capturedFrames = [];
let currentFrame = 0;
let flashEnabled = true;
let isCapturing = false;

async function startCamera(){

try{

const stream = await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user",
width:{ideal:1280},
height:{ideal:960}
},
audio:false
});

video.srcObject = stream;

}catch(err){

alert("Camera tidak dapat diakses.");

console.error(err);

}

}

startCamera();

flashToggle.addEventListener("click",()=>{

flashEnabled = !flashEnabled;

flashToggle.textContent = flashEnabled
? "⚡ Flash ON"
: "⚡ Flash OFF";

});

retakeAll.addEventListener("click",()=>{

capturedFrames = [];
currentFrame = 0;

for(let i=0;i<4;i++){

const slot = document.getElementById(`slot${i}`);

slot.innerHTML = i+1;

}

});

startBtn.addEventListener("click",async()=>{

if(isCapturing) return;

if(currentFrame >= 4){

alert("4 frame sudah penuh. Klik Retake All atau Download.");

return;

}

isCapturing = true;

await captureSequence();

isCapturing = false;

});

async function captureSequence(){

for(let i=currentFrame;i<4;i++){

const proceed = await countdownCapture(i);

if(!proceed) break;

currentFrame++;

const lanjut = await showRetakeDialog(i);

if(!lanjut){

currentFrame--;

capturedFrames.pop();

const slot = document.getElementById(`slot${i}`);

slot.innerHTML = i+1;

break;

}

}

}

async function countdownCapture(frameIndex){

for(let sec=3;sec>0;sec--){

countdown.textContent = sec;

await wait(1000);

}

countdown.textContent = "";

captureFrame(frameIndex);

return true;

}

function captureFrame(frameIndex){

canvas.width = video.videoWidth;
canvas.height = video.videoHeight;

ctx.save();

ctx.translate(canvas.width,0);
ctx.scale(-1,1);

ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);

ctx.restore();

if(flashEnabled){

flash.classList.add("active");

setTimeout(()=>{

flash.classList.remove("active");

},400);

}

shutter.classList.add("active");

setTimeout(()=>{

shutter.classList.remove("active");

},250);

const imageData = canvas.toDataURL("image/png");

capturedFrames.push(imageData);

updatePreview(frameIndex,imageData);

}

function updatePreview(index,imageData){

const slot = document.getElementById(`slot${index}`);

slot.innerHTML = "";

const img = document.createElement("img");

img.src = imageData;

slot.appendChild(img);

}

function wait(ms){

return new Promise(resolve=>{

setTimeout(resolve,ms);

});

}

function showRetakeDialog(index){

return new Promise(resolve=>{

setTimeout(()=>{

const answer = confirm(
`Frame ${index+1} sudah diambil.\n\nOK = lanjut\nCancel = retake`
);

if(answer){

resolve(true);

}else{

capturedFrames.splice(index,1);

const slot = document.getElementById(`slot${index}`);

slot.innerHTML = index+1;

resolve(false);

}

},300);

});

}
   
   
/* =========================
   FRAME SELECTOR
========================= */

let selectedFrame = "white";

const frameCards = document.querySelectorAll(".frame-card");

frameCards.forEach(card=>{

card.addEventListener("click",()=>{

frameCards.forEach(c=>{
c.classList.remove("active");
});

card.classList.add("active");

selectedFrame = card.dataset.frame;

});

});

/* =========================
   DOWNLOAD HD
========================= */

const downloadBtn =
document.getElementById("downloadBtn");

downloadBtn.addEventListener("click",()=>{

if(capturedFrames.length < 4){

alert("Ambil 4 foto terlebih dahulu.");

return;

}

generateFinalPhoto();

});

/* =========================
   GENERATE FINAL
========================= */

function generateFinalPhoto(){

const finalCanvas =
document.getElementById("finalCanvas");

const fctx =
finalCanvas.getContext("2d");

/* HD 3000x2250 */
finalCanvas.width = 3000;
finalCanvas.height = 2250;

const W = finalCanvas.width;
const H = finalCanvas.height;

/* =========================
   FRAME COLOR
========================= */

switch(selectedFrame){

case "white":
fctx.fillStyle = "#ffffff";
break;

case "black":
fctx.fillStyle = "#111111";
break;

case "maroon":
fctx.fillStyle = "#5c0f24";
break;

case "yellow":
fctx.fillStyle = "#fff4a3";
break;

case "polkadot":

fctx.fillStyle = "#111111";
fctx.fillRect(0,0,W,H);

for(let x=0;x<W;x+=60){

for(let y=0;y<H;y+=60){

fctx.beginPath();

fctx.fillStyle = "#ffffff";

fctx.arc(x,y,8,0,Math.PI*2);

fctx.fill();

}

}

break;

}

if(selectedFrame !== "polkadot"){

fctx.fillRect(0,0,W,H);

}

/* =========================
   PHOTO AREA
========================= */

const padding = 170;
const gap = 70;

const photoW =
(W - padding*2 - gap)/2;

const photoH =
(H - padding*2 - gap)/2;

const positions = [

{
x:padding,
y:padding
},

{
x:padding+photoW+gap,
y:padding
},

{
x:padding,
y:padding+photoH+gap
},

{
x:padding+photoW+gap,
y:padding+photoH+gap
}

];

let loaded = 0;

capturedFrames.forEach((src,index)=>{

const img = new Image();

img.onload = ()=>{

drawCoverImage(
fctx,
img,
positions[index].x,
positions[index].y,
photoW,
photoH
);

loaded++;

if(loaded===4){

drawWatermark(
fctx,
W,
H
);

saveFinal(finalCanvas);

}

};

img.src = src;

});

}

/* =========================
   NO STRETCH FACE
========================= */

function drawCoverImage(
ctx,
img,
x,
y,
w,
h
){

const scale =
Math.max(
w/img.width,
h/img.height
);

const nw =
img.width*scale;

const nh =
img.height*scale;

const dx =
x+(w-nw)/2;

const dy =
y+(h-nh)/2;

ctx.drawImage(
img,
dx,
dy,
nw,
nh
);

}

/* =========================
   WATERMARK
========================= */

function drawWatermark(
ctx,
W,
H
){

ctx.save();

ctx.font =
"80px Papyrus";

ctx.fillStyle =
"rgba(255,255,255,.9)";

ctx.textAlign =
"center";

ctx.fillText(
"qiephotobooth",
W/2,
H-70
);

ctx.restore();

}

/* =========================
   SAVE FILE
========================= */

function saveFinal(canvas){

const link =
document.createElement("a");

link.download =
"qiephotobooth.png";

link.href =
canvas.toDataURL(
"image/png",
1
);

link.click();

}
</script>

</body>
</html>
