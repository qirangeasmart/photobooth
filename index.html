<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qie Photobooth</title>
<style>
body{
margin:0;font-family:Arial,sans-serif;
background-color:#fff3a6;
background-image:
radial-gradient(#ff8fb1 3px, transparent 3px),
radial-gradient(#ff8fb1 3px, transparent 3px);
background-size:40px 40px;
background-position:0 0,20px 20px;
}
h1{text-align:center;margin:20px;color:#444}
.wrap{max-width:1100px;margin:auto;padding:15px}
.grid{display:grid;grid-template-columns:1fr 320px;gap:20px}
.card{background:#fff;border-radius:20px;padding:15px;box-shadow:0 4px 12px rgba(0,0,0,.12)}
video{width:100%;border-radius:15px;transform:scaleX(-1)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button,select{padding:10px;border-radius:10px;border:1px solid #ccc}
#count{font-size:48px;text-align:center;font-weight:bold}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frame{aspect-ratio:4/3;background:#eee;border-radius:10px;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover}
#result{max-width:100%;display:none}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<h1>📸 Say Cheese!</h1>
<div class="grid">
<div class="card">
<video id="video" autoplay playsinline muted></video>
<div id="count"></div>
<div class="controls">
<button id="start">Start</button>
<label><input type="checkbox" id="flash" checked> Flash ON</label>
<select id="frameStyle">
<option value="white">White</option>
<option value="black">Black</option>
<option value="maroon">Maroon</option>
<option value="yellow">Pastel Yellow</option>
<option value="dots">Black Polkadot</option>
</select>
</div>
</div>
<div class="card">
<div class="frames">
<div class="frame" id="f1"></div>
<div class="frame" id="f2"></div>
<div class="frame" id="f3"></div>
<div class="frame" id="f4"></div>
</div>
<hr>
<img id="result">
<br><button id="download" style="display:none">Download PNG</button>
</div>
</div>
</div>
<script>
const video=document.getElementById('video');
const count=document.getElementById('count');
const photos=[];
let finalData='';

navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}})
.then(s=>video.srcObject=s);

function wait(ms){return new Promise(r=>setTimeout(r,ms));}

async function shot(){
for(let i=0;i<4;i++){
for(let n=3;n>0;n--){count.textContent=n;await wait(1000);}
count.textContent='';
if(document.getElementById('flash').checked){
const d=document.createElement('div');
d.style='position:fixed;inset:0;background:white;z-index:999';
document.body.appendChild(d);
setTimeout(()=>d.remove(),150);
}
const c=document.createElement('canvas');
c.width=video.videoWidth;c.height=video.videoHeight;
const x=c.getContext('2d');
x.translate(c.width,0);x.scale(-1,1);
x.drawImage(video,0,0);
const data=c.toDataURL('image/png');
photos[i]=data;
document.getElementById('f'+(i+1)).innerHTML='<img src="'+data+'">';
await wait(300);
}
makeStrip();
}

async function makeStrip(){
const c=document.createElement('canvas');
c.width=1200;c.height=900;
const x=c.getContext('2d');

let style=document.getElementById('frameStyle').value;
if(style==='white') x.fillStyle='#fff';
if(style==='black') x.fillStyle='#111';
if(style==='maroon') x.fillStyle='#6b1f2a';
if(style==='yellow') x.fillStyle='#fff1a8';
if(style==='dots'){
x.fillStyle='#111';x.fillRect(0,0,c.width,c.height);
x.fillStyle='#fff';
for(let yy=20;yy<900;yy+=30){for(let xx=20;xx<1200;xx+=30){x.beginPath();x.arc(xx,yy,3,0,7);x.fill();}}
}else{x.fillRect(0,0,c.width,c.height);}

const pos=[[60,60],[630,60],[60,430],[630,430]];
for(let i=0;i<4;i++){
const img=new Image();
await new Promise(res=>{img.onload=res;img.src=photos[i]});
x.drawImage(img,pos[i][0],pos[i][1],510,300);
}
x.font='24px Arial';
x.fillStyle=(style==='white'||style==='yellow')?'#444':'#fff';
x.textAlign='right';
x.fillText('qiephotobooth',1160,870);

finalData=c.toDataURL('image/png');
document.getElementById('result').src=finalData;
document.getElementById('result').style.display='block';
document.getElementById('download').style.display='inline-block';
}

document.getElementById('start').onclick=()=>{photos.length=0;shot();};
document.getElementById('download').onclick=()=>{
const a=document.createElement('a');
a.href=finalData;a.download='qiephotobooth.png';a.click();
};
</script>
</body>
</html>
