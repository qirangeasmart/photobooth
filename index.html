<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Qie Photobooth Premium</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Caveat:wght@700&display=swap" rel="stylesheet">

<style>
 *{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--yellow:#FFF5B8;
--pink:#FF7DBD;
--dark:#222;
--white:#fff;

}

body{

font-family:'DM Sans',sans-serif;

background:var(--yellow);

overflow-x:hidden;

min-height:100vh;

position:relative;

}

/* ===================
RANDOM POLKADOT BG
=================== */

body::before{

content:"";

position:fixed;

inset:0;

pointer-events:none;

opacity:.65;

background:

radial-gradient(circle at 8% 12%, #ff7dbd 16px, transparent 17px),
radial-gradient(circle at 22% 44%, #ff7dbd 24px, transparent 25px),
radial-gradient(circle at 38% 15%, #ff7dbd 18px, transparent 19px),
radial-gradient(circle at 54% 72%, #ff7dbd 22px, transparent 23px),
radial-gradient(circle at 76% 24%, #ff7dbd 19px, transparent 20px),
radial-gradient(circle at 88% 12%, #ff7dbd 26px, transparent 27px),
radial-gradient(circle at 15% 83%, #ff7dbd 21px, transparent 22px),
radial-gradient(circle at 32% 67%, #ff7dbd 17px, transparent 18px),
radial-gradient(circle at 58% 92%, #ff7dbd 23px, transparent 24px),
radial-gradient(circle at 92% 75%, #ff7dbd 20px, transparent 21px);

}

/* ===================
HEADER
=================== */

.header{

padding:20px;

text-align:center;

}

.logo{

font-family:'Caveat',cursive;

font-size:4rem;

color:#ff4da2;

text-shadow:
3px 3px 0 white,
6px 6px 0 rgba(0,0,0,.08);

}

/* ===================
LAYOUT
=================== */

.container{

max-width:1450px;

margin:auto;

padding:20px;

display:flex;

gap:30px;

justify-content:center;

align-items:flex-start;

flex-wrap:wrap;

}

.camera-side{

width:700px;

max-width:95vw;

}

.preview-side{

width:420px;

max-width:95vw;

}

/* ===================
CAMERA CARD
=================== */

.camera-card{

background:white;

border-radius:30px;

overflow:hidden;

box-shadow:
0 15px 40px rgba(0,0,0,.12);

position:relative;

}

video{

width:100%;

aspect-ratio:4/3;

object-fit:cover;

transform:scaleX(-1);

display:block;

}

.flash-layer{

position:absolute;

inset:0;

background:white;

opacity:0;

pointer-events:none;

}

.shutter-layer{

position:absolute;

inset:0;

background:black;

opacity:0;

pointer-events:none;

}

/* ===================
COUNTDOWN
=================== */

.countdown{

position:absolute;

top:50%;
left:50%;

transform:
translate(-50%,-50%);

width:170px;
height:170px;

border-radius:50%;

background:
rgba(255,255,255,.9);

display:none;

justify-content:center;
align-items:center;

font-size:80px;

font-weight:bold;

color:#ff4da2;

backdrop-filter:blur(10px);

}

/* ===================
BUTTONS
=================== */

.controls{

display:flex;

flex-wrap:wrap;

gap:10px;

justify-content:center;

margin-top:15px;

}

.btn{

border:none;

cursor:pointer;

padding:12px 18px;

border-radius:18px;

font-size:16px;

font-weight:600;

transition:.2s;

}

.btn:hover{

transform:translateY(-2px);

}

.start-btn{
background:#ff5faf;
color:white;
}

.flash-btn{
background:#ffe269;
}

.retake-btn{
background:#333;
color:white;
}

.download-btn{
background:#59c76d;
color:white;
}
   /* ===================
PREVIEW
=================== */

.preview-title{

font-size:1.4rem;

margin-bottom:15px;

}

.preview-grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:12px;

}

.preview-box{

aspect-ratio:4/3;

background:white;

border-radius:20px;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

font-size:38px;

cursor:pointer;

box-shadow:
0 10px 25px rgba(0,0,0,.08);

}

.preview-box img{

width:100%;
height:100%;

object-fit:cover;

}

/* ===================
RESPONSIVE
=================== */

@media(max-width:1000px){

.container{

flex-direction:column;

align-items:center;

}

.camera-side,
.preview-side{

width:100%;

}

}

canvas{

display:none;

}
</style>

</head>

<body>

<div class="header">

<h1 class="logo">
Say Cheese ✨
</h1>

</div>

<div class="container">

<div class="camera-side">

<div class="camera-card">

<video
id="video"
autoplay
playsinline>
</video>

<div
id="flashLayer"
class="flash-layer">
</div>

<div
id="shutterLayer"
class="shutter-layer">
</div>

<div
id="countdown"
class="countdown">
3
</div>

</div>

<div class="controls">

<button
id="startBtn"
class="btn start-btn">
📸 Start
</button>

<button
id="flashBtn"
class="btn flash-btn">
⚡ Flash ON
</button>

<button
id="retakeAllBtn"
class="btn retake-btn">
🔄 Retake All
</button>

<button
id="downloadBtn"
class="btn download-btn">
⬇ Download
</button>

</div>

</div>

<div class="preview-side">

<h2 class="preview-title">
Preview Photos
</h2>

<div class="preview-grid">

<div class="preview-box" id="p0">1</div>
<div class="preview-box" id="p1">2</div>
<div class="preview-box" id="p2">3</div>
<div class="preview-box" id="p3">4</div>

</div>

</div>

</div>

<canvas id="captureCanvas"></canvas>
<canvas id="finalCanvas"></canvas>

<script>
/* ======================================
   QIE PHOTOBOOTH PREMIUM
   PART 2 - CAMERA ENGINE
====================================== */

const video =
document.getElementById("video");

const startBtn =
document.getElementById("startBtn");

const flashBtn =
document.getElementById("flashBtn");

const retakeAllBtn =
document.getElementById("retakeAllBtn");

const flashLayer =
document.getElementById("flashLayer");

const shutterLayer =
document.getElementById("shutterLayer");

const countdown =
document.getElementById("countdown");

const captureCanvas =
document.getElementById("captureCanvas");

const captureCtx =
captureCanvas.getContext("2d");

let flashEnabled = true;

let photos = [];

let currentPhoto = 0;

let sessionRunning = false;


/* ==========================
   SHUTTER SOUND
========================== */

const shutterSound =
new Audio(
"https://actions.google.com/sounds/v1/camera/camera_shutter_click_01.mp3"
);


/* ==========================
   START CAMERA
========================== */

async function startCamera(){

try{

const stream =
await navigator.mediaDevices.getUserMedia({

video:{

facingMode:"user",

width:{
ideal:1920
},

height:{
ideal:1440
}

},

audio:false

});

video.srcObject = stream;

}catch(err){

alert(
"Kamera tidak dapat diakses."
);

console.error(err);

}

}

startCamera();


/* ==========================
   FLASH TOGGLE
========================== */

flashBtn.addEventListener(
"click",
()=>{

flashEnabled =
!flashEnabled;

flashBtn.textContent =
flashEnabled
?
"⚡ Flash ON"
:
"⚡ Flash OFF";

}
);


/* ==========================
   COUNTDOWN
========================== */

async function runCountdown(){

countdown.style.display =
"flex";

for(
let i=3;
i>=1;
i--
){

countdown.textContent = i;

countdown.animate(

[
{
transform:
"translate(-50%,-50%) scale(1.4)"
},

{
transform:
"translate(-50%,-50%) scale(1)"
}
],

{
duration:900
}

);

await sleep(1000);

}

countdown.style.display =
"none";

}


/* ==========================
   FLASH EFFECT
========================== */

function showFlash(){

if(!flashEnabled)
return;

flashLayer.animate(

[
{opacity:1},
{opacity:0}
],

{
duration:350
}

);

}


/* ==========================
   SHUTTER EFFECT
========================== */

function showShutter(){

shutterLayer.animate(

[
{opacity:0},
{opacity:.9},
{opacity:0}
],

{
duration:250
}

);

}


/* ==========================
   BEAUTY FILTER
========================== */

function applyBeauty(){

captureCtx.filter =
`
brightness(1.10)
contrast(1.05)
saturate(1.08)
sepia(.03)
`;

}


/* ==========================
   CAPTURE PHOTO
========================== */

function captureFrame(index){

captureCanvas.width =
video.videoWidth;

captureCanvas.height =
video.videoHeight;


/* mirror selfie */

captureCtx.save();

captureCtx.translate(
captureCanvas.width,
0
);

captureCtx.scale(-1,1);

applyBeauty();

captureCtx.drawImage(

video,

0,
0,

captureCanvas.width,
captureCanvas.height

);

captureCtx.restore();

captureCtx.filter =
"none";


try{

shutterSound.currentTime = 0;

shutterSound.play();

}catch(e){}


showFlash();

showShutter();


const photo =
captureCanvas.toDataURL(
"image/png"
);

photos[index] =
photo;

updatePreview(
index,
photo
);

}


/* ==========================
   PREVIEW PHOTO
========================== */

function updatePreview(
index,
photo
){

const box =
document.getElementById(
`p${index}`
);

box.innerHTML = "";

const img =
document.createElement(
"img"
);

img.src = photo;

box.appendChild(img);

}


/* ==========================
   START SESSION
========================== */

startBtn.addEventListener(
"click",
async()=>{

if(sessionRunning)
return;

if(
photos.length===4
){

alert(
"Semua frame sudah terisi."
);

return;

}

sessionRunning = true;

for(
let i=currentPhoto;
i<4;
i++
){

await runCountdown();

captureFrame(i);

currentPhoto++;

await sleep(600);

}

sessionRunning = false;

alert(
"✨ Semua foto selesai!"
);

}
);


/* ==========================
   RETAKE ALL
========================== */

retakeAllBtn.addEventListener(
"click",
()=>{

photos = [];

currentPhoto = 0;

for(
let i=0;
i<4;
i++
){

document.getElementById(
`p${i}`
).innerHTML = i+1;

}

}
);


/* ==========================
   HELPER
========================== */

function sleep(ms){

return new Promise(
resolve=>{

setTimeout(
resolve,
ms
);

}
);

}
/* ======================================
   PART 3 - FRAME SELECTOR
====================================== */


/* ==========================
   FRAME DATA
========================== */

let selectedFrame =
"white";


/* ==========================
   CREATE FRAME MODAL
========================== */

const frameModal =
document.createElement("div");

frameModal.id =
"frameModal";

frameModal.style.cssText = `
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
`;

frameModal.innerHTML = `

<div style="
background:white;
padding:25px;
border-radius:28px;
width:900px;
max-width:95vw;
">

<h2 style="
text-align:center;
margin-bottom:20px;
font-size:2rem;
">
Choose Your Frame 🎀
</h2>

<div id="frameGrid"
style="
display:grid;
grid-template-columns:
repeat(5,1fr);
gap:15px;
">

</div>

<div style="
text-align:center;
margin-top:20px;
">

<button
id="confirmFrameBtn"
style="
padding:12px 24px;
border:none;
border-radius:16px;
background:#ff66b3;
color:white;
font-size:16px;
cursor:pointer;
">
Done
</button>

</div>

</div>

`;

document.body.appendChild(
frameModal
);


/* ==========================
   FRAME OPTIONS
========================== */

const frameOptions = [

"white",
"black",
"maroon",
"yellow",
"polka"

];

const frameGrid =
document.getElementById(
"frameGrid"
);

frameOptions.forEach(type=>{

const item =
document.createElement(
"div"
);

item.dataset.frame =
type;

item.style.height =
"140px";

item.style.borderRadius =
"18px";

item.style.cursor =
"pointer";

item.style.border =
"4px solid transparent";


if(type==="white")
item.style.background =
"#fff";

if(type==="black")
item.style.background =
"#111";

if(type==="maroon")
item.style.background =
"#641b2e";

if(type==="yellow")
item.style.background =
"#FFF5B8";


if(type==="polka"){

item.style.background =
"#111";

item.style.position =
"relative";

item.innerHTML = `

<div style="
position:absolute;
inset:0;

background:

radial-gradient(circle at 15% 20%,white 6px,transparent 7px),
radial-gradient(circle at 35% 70%,white 8px,transparent 9px),
radial-gradient(circle at 80% 30%,white 7px,transparent 8px),
radial-gradient(circle at 60% 85%,white 5px,transparent 6px),
radial-gradient(circle at 25% 90%,white 8px,transparent 9px);

">
</div>

`;

}


item.addEventListener(
"click",
()=>{

document
.querySelectorAll(
"#frameGrid > div"
)
.forEach(el=>{

el.style.border =
"4px solid transparent";

});

item.style.border =
"4px solid #ff66b3";

selectedFrame =
type;

}
);

frameGrid.appendChild(
item
);

});


/* ==========================
   OPEN FRAME MODAL
========================== */

downloadBtn.addEventListener(
"click",
()=>{

if(
photos.length < 4
){

alert(
"Ambil 4 foto terlebih dahulu."
);

return;

}

frameModal.style.display =
"flex";

}
);


/* ==========================
   CONFIRM FRAME
========================== */

document
.getElementById(
"confirmFrameBtn"
)
.addEventListener(
"click",
()=>{

frameModal.style.display =
"none";

generateFinalPhoto();

}
);


/* ==========================
   RETAKE PER FOTO
========================== */

for(
let i=0;
i<4;
i++
){

const box =
document.getElementById(
`p${i}`
);

box.addEventListener(
"click",
()=>{

if(
!photos[i]
)
return;

const yes =
confirm(
`Retake Foto ${i+1}?`
);

if(!yes)
return;

retakeSingle(i);

}
);

}


async function retakeSingle(index){

await runCountdown();

captureFrame(index);

}


/* ==========================
   PREVIEW HIGHLIGHT
========================== */

const oldUpdatePreview =
updatePreview;

updatePreview =
function(index,photo){

oldUpdatePreview(
index,
photo
);

const box =
document.getElementById(
`p${index}`
);

box.style.border =
"4px solid #ff7dbd";

};
/* ======================================
   PART 4 - EXPORT ENGINE
====================================== */


/* ==========================
   GENERATE FINAL PHOTO
========================== */

function generateFinalPhoto(){

const finalCanvas =
document.getElementById(
"finalCanvas"
);

const ctx =
finalCanvas.getContext("2d");


/* HD EXPORT */

finalCanvas.width = 3000;
finalCanvas.height = 2250;

const W =
finalCanvas.width;

const H =
finalCanvas.height;


/* ==========================
   FRAME BACKGROUND
========================== */

drawFrameBackground(
ctx,
W,
H
);


/* ==========================
   PHOTO LAYOUT
========================== */

const padding = 180;
const gap = 70;

const photoWidth =
(W - (padding*2) - gap)
/ 2;

const photoHeight =
(H - (padding*2) - gap)
/ 2;


const positions = [

{
x:padding,
y:padding
},

{
x:padding + photoWidth + gap,
y:padding
},

{
x:padding,
y:padding + photoHeight + gap
},

{
x:padding + photoWidth + gap,
y:padding + photoHeight + gap
}

];


let loaded = 0;


photos.forEach(
(src,index)=>{

const img =
new Image();

img.onload = ()=>{

drawPhotoCover(

ctx,

img,

positions[index].x,
positions[index].y,

photoWidth,
photoHeight

);

loaded++;

if(
loaded === 4
){

drawWatermark(
ctx,
W,
H
);

downloadPhoto(
finalCanvas
);

}

};

img.src = src;

});

}


/* ==========================
   FRAME COLORS
========================== */

function drawFrameBackground(
ctx,
W,
H
){

switch(selectedFrame){

case "white":

ctx.fillStyle =
"#ffffff";

ctx.fillRect(
0,
0,
W,
H
);

break;


case "black":

ctx.fillStyle =
"#111111";

ctx.fillRect(
0,
0,
W,
H
);

break;


case "maroon":

ctx.fillStyle =
"#641b2e";

ctx.fillRect(
0,
0,
W,
H
);

break;


case "yellow":

ctx.fillStyle =
"#FFF5B8";

ctx.fillRect(
0,
0,
W,
H
);

break;


case "polka":

ctx.fillStyle =
"#111111";

ctx.fillRect(
0,
0,
W,
H
);

for(
let i=0;
i<500;
i++
){

const x =
Math.random()*W;

const y =
Math.random()*H;

const r =
Math.random()*10 + 5;

ctx.beginPath();

ctx.arc(
x,
y,
r,
0,
Math.PI*2
);

ctx.fillStyle =
"white";

ctx.fill();

}

break;

}

}


/* ==========================
   NO STRETCH FACE
========================== */

function drawPhotoCover(

ctx,
img,

x,
y,

w,
h

){

const scale =
Math.max(

w/img.width,

h/img.height

);

const nw =
img.width *
scale;

const nh =
img.height *
scale;

const dx =
x +
(w-nw)/2;

const dy =
y +
(h-nh)/2;


/* soft shadow */

ctx.save();

ctx.shadowColor =
"rgba(0,0,0,.12)";

ctx.shadowBlur =
25;

ctx.shadowOffsetY =
8;

ctx.drawImage(
img,
dx,
dy,
nw,
nh
);

ctx.restore();

}


/* ==========================
   WATERMARK
========================== */

function drawWatermark(
ctx,
W,
H
){

ctx.save();

ctx.font =
"72px Papyrus";

ctx.fillStyle =
"rgba(255,255,255,.95)";

ctx.textAlign =
"left";

ctx.fillText(

"qiephotobooth",

60,

H-55

);

ctx.restore();

}


/* ==========================
   DOWNLOAD PNG
========================== */

function downloadPhoto(
canvas
){

const link =
document.createElement(
"a"
);

link.download =
"qiephotobooth.png";

link.href =
canvas.toDataURL(
"image/png",
1
);

link.click();

}
/* ======================================
   PART 5 - PREMIUM EXPERIENCE
====================================== */


/* ==========================
   RESULT PREVIEW MODAL
========================== */

const resultModal =
document.createElement("div");

resultModal.id =
"resultModal";

resultModal.style.cssText = `
position:fixed;
inset:0;
background:rgba(0,0,0,.6);
display:none;
justify-content:center;
align-items:center;
z-index:99999;
`;

resultModal.innerHTML = `

<div style="
background:white;
padding:25px;
border-radius:25px;
width:90%;
max-width:900px;
text-align:center;
">

<h2 style="
margin-bottom:15px;
font-family:'Caveat',cursive;
font-size:2.5rem;
color:#ff5faf;
">
Your Photobooth ✨
</h2>

<img
id="resultPreviewImage"
style="
width:100%;
border-radius:20px;
box-shadow:0 15px 30px rgba(0,0,0,.12);
"
>

<div style="
margin-top:20px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
">

<button
id="confirmDownloadBtn"
class="btn download-btn">
⬇ Download
</button>

<button
id="closePreviewBtn"
class="btn retake-btn">
✖ Close
</button>

</div>

</div>

`;

document.body.appendChild(
resultModal
);


/* ==========================
   SHOW RESULT PREVIEW
========================== */

let latestExportData =
null;

const originalDownload =
downloadPhoto;

downloadPhoto =
function(canvas){

latestExportData =
canvas.toDataURL(
"image/png",
1
);

document
.getElementById(
"resultPreviewImage"
)
.src =
latestExportData;

resultModal.style.display =
"flex";

};


/* ==========================
   CONFIRM DOWNLOAD
========================== */

document
.getElementById(
"confirmDownloadBtn"
)
.addEventListener(
"click",
()=>{

const link =
document.createElement(
"a"
);

link.download =
"qiephotobooth.png";

link.href =
latestExportData;

link.click();

}
);


/* ==========================
   CLOSE PREVIEW
========================== */

document
.getElementById(
"closePreviewBtn"
)
.addEventListener(
"click",
()=>{

resultModal.style.display =
"none";

}
);


/* ==========================
   COUNTDOWN GLOW EFFECT
========================== */

const oldCountdown =
runCountdown;

runCountdown =
async function(){

countdown.style.boxShadow =
"0 0 40px #ff7dbd";

await oldCountdown();

countdown.style.boxShadow =
"none";

};


/* ==========================
   SMOOTH FLASH
========================== */

showFlash =
function(){

if(!flashEnabled)
return;

flashLayer.animate(

[
{
opacity:0
},

{
opacity:1
},

{
opacity:0
}

],

{
duration:500
}

);

};


/* ==========================
   PREVIEW HOVER EFFECT
========================== */

for(
let i=0;
i<4;
i++
){

const box =
document.getElementById(
`p${i}`
);

box.addEventListener(
"mouseenter",
()=>{

box.style.transform =
"scale(1.03)";

}
);

box.addEventListener(
"mouseleave",
()=>{

box.style.transform =
"scale(1)";

}
);

}


/* ==========================
   MOBILE FIX
========================== */

if(
window.innerWidth < 768
){

document
.querySelector(
".logo"
)
.style.fontSize =
"3rem";

}


/* ==========================
   FINISH SESSION EFFECT
========================== */

const originalStart =
startBtn.onclick;

startBtn.onclick =
async()=>{

await originalStart;

if(
photos.length === 4
){

setTimeout(()=>{

alert(
"🎉 Photobooth selesai!\nPilih frame favoritmu lalu download."
);

},500);

}

};
/* ======================================
   PART 6 - FINAL POLISH
====================================== */


/* ==========================
   COUNTDOWN PROGRESS RING
========================== */

const ring =
document.createElement("div");

ring.id = "progressRing";

ring.style.cssText = `
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:210px;
height:210px;
border-radius:50%;
border:8px solid rgba(255,255,255,.5);
display:none;
pointer-events:none;
`;

document
.querySelector(".camera-card")
.appendChild(ring);


/* override countdown */

const originalRunCountdown =
runCountdown;

runCountdown = async function(){

ring.style.display =
"block";

ring.animate(

[
{
transform:
"translate(-50%,-50%) rotate(0deg)"
},

{
transform:
"translate(-50%,-50%) rotate(360deg)"
}
],

{
duration:3000
}

);

await originalRunCountdown();

ring.style.display =
"none";

};


/* ==========================
   RETAKE SELECTED BUTTON
========================== */

const retakeSelectedBtn =
document.createElement(
"button"
);

retakeSelectedBtn.innerHTML =
"📷 Retake Selected";

retakeSelectedBtn.className =
"btn retake-btn";

document
.querySelector(".controls")
.appendChild(
retakeSelectedBtn
);

let selectedPreview =
null;


for(
let i=0;
i<4;
i++
){

const box =
document.getElementById(
`p${i}`
);

box.addEventListener(
"click",
()=>{

selectedPreview = i;

document
.querySelectorAll(
".preview-box"
)
.forEach(el=>{

el.style.border =
"none";

});

box.style.border =
"4px solid #ff69b4";

}
);

}


retakeSelectedBtn.onclick =
async()=>{

if(
selectedPreview===null
){

alert(
"Pilih foto dahulu."
);

return;

}

await runCountdown();

captureFrame(
selectedPreview
);

};


/* ==========================
   FRAME THUMBNAIL LABEL
========================== */

document
.querySelectorAll(
"#frameGrid > div"
)
.forEach(frame=>{

const label =
document.createElement(
"span"
);

label.style.cssText = `
position:absolute;
bottom:8px;
left:0;
right:0;
text-align:center;
font-size:12px;
font-weight:bold;
color:white;
`;

label.innerText =
frame.dataset.frame;

frame.style.position =
"relative";

frame.appendChild(
label
);

});


/* ==========================
   USE THIS FRAME BUTTON
========================== */

const useFrameBtn =
document.createElement(
"button"
);

useFrameBtn.innerHTML =
"✨ Use This Frame";

useFrameBtn.style.cssText = `
padding:12px 20px;
border:none;
border-radius:14px;
background:#ff69b4;
color:white;
font-size:15px;
cursor:pointer;
margin-top:15px;
`;

document
.querySelector(
"#confirmFrameBtn"
)
.parentNode
.appendChild(
useFrameBtn
);

useFrameBtn.onclick =
()=>{

alert(
`Frame "${selectedFrame}" dipilih ✨`
);

};


/* ==========================
   FINAL READY MESSAGE
========================== */

window.addEventListener(
"load",
()=>{

console.log(
"Qie Photobooth Premium Ready ✨"
);

}
);
</script>

</body>
