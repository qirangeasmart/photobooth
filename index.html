<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Qie Photobooth Premium</title>

<style>

@font-face{
font-family:PapyrusLike;
src:local("Papyrus");
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root{

--pink:#ff69b4;
--yellow:#fff4b0;
--maroon:#641b2e;
--shadow:0 10px 30px rgba(0,0,0,.12);

}

body{

font-family:PapyrusLike,cursive;

background:var(--yellow);

overflow-x:hidden;
min-height:100vh;
position:relative;

}

/* =====================
RANDOM POLKADOT BG
===================== */

body::before{

content:"";

position:fixed;
inset:0;

pointer-events:none;

opacity:.65;

background:

radial-gradient(circle at 11% 13%, #ff78bf 15px, transparent 16px),
radial-gradient(circle at 31% 75%, #ff78bf 22px, transparent 23px),
radial-gradient(circle at 56% 18%, #ff78bf 17px, transparent 18px),
radial-gradient(circle at 79% 33%, #ff78bf 20px, transparent 21px),
radial-gradient(circle at 92% 68%, #ff78bf 18px, transparent 19px),
radial-gradient(circle at 17% 56%, #ff78bf 24px, transparent 25px),
radial-gradient(circle at 41% 92%, #ff78bf 14px, transparent 15px),
radial-gradient(circle at 67% 81%, #ff78bf 23px, transparent 24px),
radial-gradient(circle at 88% 8%, #ff78bf 19px, transparent 20px);

}

/* =====================
HEADER
===================== */

.header{

text-align:center;
padding:25px 15px;

}

.logo{

font-size:3rem;
color:#ff4ca5;

text-shadow:
3px 3px 0 #fff,
6px 6px 0 rgba(0,0,0,.08);

letter-spacing:2px;

}

/* =====================
LAYOUT
===================== */

.wrapper{

max-width:1450px;

margin:auto;

padding:20px;

display:flex;
gap:30px;
justify-content:center;
align-items:flex-start;
flex-wrap:wrap;

}

/* =====================
LEFT CAMERA
===================== */

.left{

width:700px;
max-width:95vw;

}

.camera-card{

background:#fff;

border-radius:28px;

overflow:hidden;

box-shadow:var(--shadow);

position:relative;

}

video{

width:100%;
aspect-ratio:4/3;

display:block;

object-fit:cover;

/* selfie mirror */

transform:scaleX(-1);

}

.flash-layer{

position:absolute;
inset:0;

background:white;

opacity:0;

pointer-events:none;

}

.shutter-layer{

position:absolute;
inset:0;

background:black;

opacity:0;

pointer-events:none;

}

/* =====================
COUNTDOWN
===================== */

.countdown{

position:absolute;

left:50%;
top:50%;

transform:
translate(-50%,-50%);

width:160px;
height:160px;

border-radius:50%;

background:
rgba(255,255,255,.9);

display:none;

justify-content:center;
align-items:center;

font-size:72px;
font-weight:bold;

color:var(--pink);

backdrop-filter:blur(8px);

}

/* =====================
BUTTONS
===================== */

.controls{

margin-top:15px;

display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;

}

.btn{

border:none;

padding:12px 18px;

border-radius:18px;

cursor:pointer;

font-size:18px;

font-family:PapyrusLike,cursive;

transition:.2s;

}

.btn:hover{

transform:translateY(-2px);

}

.start{

background:#ff61b2;
color:white;

}

.flashbtn{

background:#ffe066;

}

.retake{

background:#333;
color:white;

}

.download{

background:#52c26d;
color:white;

}

/* =====================
PREVIEW PANEL
===================== */

.right{

width:430px;
max-width:95vw;

}

.preview-title{

font-size:1.6rem;

margin-bottom:15px;

}

.preview-grid{

display:grid;

grid-template-columns:
1fr 1fr;

gap:12px;

}

.preview{

aspect-ratio:4/3;

background:white;

border-radius:20px;

overflow:hidden;

display:flex;

justify-content:center;
align-items:center;

font-size:38px;

box-shadow:var(--shadow);

cursor:pointer;

}

.preview img{

width:100%;
height:100%;

object-fit:cover;

}

/* =====================
FRAME MODAL
===================== */

.frame-modal{

position:fixed;

inset:0;

background:
rgba(0,0,0,.45);

display:none;

justify-content:center;
align-items:center;

z-index:999;

}

.frame-box{

background:white;

padding:25px;

border-radius:24px;

width:800px;
max-width:95vw;

}

.frame-title{

font-size:2rem;
margin-bottom:20px;

text-align:center;

}

.frame-grid{

display:grid;

grid-template-columns:
repeat(5,1fr);

gap:15px;

}

.frame{

height:120px;

border-radius:18px;

cursor:pointer;

border:4px solid transparent;

transition:.2s;

}

.frame.active{

border-color:#ff61b2;

}

/* frame colors */

.white{
background:white;
}

.black{
background:#111;
}

.maroon{
background:#641b2e;
}

.yellow{
background:#fff4b0;
}

.polka{

background:#111;

position:relative;

overflow:hidden;

}

.polka::before{

content:"";

position:absolute;
inset:0;

background:

radial-gradient(circle at 14% 19%, white 5px, transparent 6px),
radial-gradient(circle at 36% 57%, white 7px, transparent 8px),
radial-gradient(circle at 79% 24%, white 6px, transparent 7px),
radial-gradient(circle at 68% 80%, white 5px, transparent 6px),
radial-gradient(circle at 23% 83%, white 8px, transparent 9px);

}

/* =====================
RESPONSIVE
===================== */

@media(max-width:1000px){

.wrapper{

flex-direction:column;
align-items:center;

}

.left,
.right{

width:100%;

}

}

canvas{

display:none;

}

</style>

</head>

<body>

<div class="header">

<h1 class="logo">
SAY CHEESE ✨
</h1>

</div>

<div class="wrapper">

<div class="left">

<div class="camera-card">

<video
id="video"
autoplay
playsinline>
</video>

<div
id="flashLayer"
class="flash-layer">
</div>

<div
id="shutterLayer"
class="shutter-layer">
</div>

<div
id="countdown"
class="countdown">
3
</div>

</div>

<div class="controls">

<button
id="startBtn"
class="btn start">
📸 Start
</button>

<button
id="flashBtn"
class="btn flashbtn">
⚡ Flash ON
</button>

<button
id="retakeAllBtn"
class="btn retake">
🔄 Retake All
</button>

<button
id="downloadBtn"
class="btn download">
⬇ Download
</button>

</div>

</div>

<div class="right">

<h2 class="preview-title">
Preview Photos
</h2>

<div class="preview-grid">

<div class="preview" id="p0">
1
</div>

<div class="preview" id="p1">
2
</div>

<div class="preview" id="p2">
3
</div>

<div class="preview" id="p3">
4
</div>

</div>

</div>

</div>

<div
id="frameModal"
class="frame-modal">

<div class="frame-box">

<h2 class="frame-title">
Choose Frame 🎀
</h2>

<div class="frame-grid">

<div
class="frame white active"
data-frame="white">
</div>

<div
class="frame black"
data-frame="black">
</div>

<div
class="frame maroon"
data-frame="maroon">
</div>

<div
class="frame yellow"
data-frame="yellow">
</div>

<div
class="frame polka"
data-frame="polka">
</div>

</div>

</div>

</div>

<canvas id="captureCanvas"></canvas>
<canvas id="finalCanvas"></canvas>

<script>
   /* ===================================
   QIE PHOTOBOOTH PREMIUM
   PART 2 - CAMERA ENGINE
=================================== */

const video = document.getElementById("video");
const startBtn = document.getElementById("startBtn");
const flashBtn = document.getElementById("flashBtn");
const retakeAllBtn = document.getElementById("retakeAllBtn");

const flashLayer =
document.getElementById("flashLayer");

const shutterLayer =
document.getElementById("shutterLayer");

const countdown =
document.getElementById("countdown");

const captureCanvas =
document.getElementById("captureCanvas");

const captureCtx =
captureCanvas.getContext("2d");

let flashEnabled = true;

let capturedPhotos = [];

let currentFrame = 0;

let takingPhotos = false;


/* ======================
   SHUTTER SOUND
====================== */

const shutterSound = new Audio(
"https://actions.google.com/sounds/v1/camera/camera_shutter_click_01.mp3"
);


/* ======================
   START CAMERA
====================== */

async function startCamera(){

try{

const stream =
await navigator.mediaDevices.getUserMedia({

video:{

facingMode:"user",

width:{
ideal:1920
},

height:{
ideal:1440
}

},

audio:false

});

video.srcObject = stream;

}catch(err){

alert(
"Camera tidak dapat diakses."
);

console.error(err);

}

}

startCamera();


/* ======================
   FLASH TOGGLE
====================== */

flashBtn.onclick = ()=>{

flashEnabled =
!flashEnabled;

flashBtn.textContent =
flashEnabled
?
"⚡ Flash ON"
:
"⚡ Flash OFF";

};


/* ======================
   RETAKE ALL
====================== */

retakeAllBtn.onclick = ()=>{

capturedPhotos = [];

currentFrame = 0;

for(let i=0;i<4;i++){

const box =
document.getElementById(
`p${i}`
);

box.innerHTML = i+1;

}

};


/* ======================
   COUNTDOWN
====================== */

async function countdownAnimation(){

countdown.style.display =
"flex";

for(
let i=3;
i>=1;
i--
){

countdown.textContent = i;

countdown.animate(

[
{
transform:
"translate(-50%,-50%) scale(1.4)"
},

{
transform:
"translate(-50%,-50%) scale(1)"
}
],

{
duration:900
}

);

await wait(1000);

}

countdown.style.display =
"none";

}


/* ======================
   FLASH EFFECT
====================== */

function flashEffect(){

if(!flashEnabled)
return;

flashLayer.animate(

[
{opacity:1},
{opacity:0}
],

{
duration:350
}

);

}


/* ======================
   SHUTTER EFFECT
====================== */

function shutterEffect(){

shutterLayer.animate(

[
{opacity:0},
{opacity:.9},
{opacity:0}
],

{
duration:250
}

);

}


/* ======================
   BEAUTY FILTER
====================== */

function applyBeauty(){

captureCtx.filter =
`
brightness(1.08)
contrast(1.04)
saturate(1.08)
`;

}


/* ======================
   CAPTURE PHOTO
====================== */

function capturePhoto(index){

captureCanvas.width =
video.videoWidth;

captureCanvas.height =
video.videoHeight;


/* selfie mirror */

captureCtx.save();

captureCtx.translate(
captureCanvas.width,
0
);

captureCtx.scale(-1,1);

applyBeauty();

captureCtx.drawImage(

video,

0,
0,

captureCanvas.width,
captureCanvas.height

);

captureCtx.restore();

captureCtx.filter =
"none";


try{

shutterSound.currentTime=0;

shutterSound.play();

}catch(e){}


flashEffect();

shutterEffect();


const photo =
captureCanvas.toDataURL(
"image/png"
);

capturedPhotos[index] =
photo;

showPreview(
index,
photo
);

}


/* ======================
   PREVIEW PANEL
====================== */

function showPreview(
index,
photo
){

const box =
document.getElementById(
`p${index}`
);

box.innerHTML="";

const img =
document.createElement(
"img"
);

img.src = photo;

box.appendChild(img);

}


/* ======================
   PHOTO SESSION
====================== */

startBtn.onclick =
async()=>{

if(takingPhotos)
return;

if(
capturedPhotos.length===4
){

alert(
"Gunakan Retake atau Download."
);

return;

}

takingPhotos = true;

for(
let i=currentFrame;
i<4;
i++
){

await countdownAnimation();

capturePhoto(i);

currentFrame++;

await wait(500);

}

takingPhotos = false;


/* open frame selector */

document
.getElementById(
"frameModal"
)
.style.display =
"flex";

};


/* ======================
   UTIL
====================== */

function wait(ms){

return new Promise(
resolve=>{

setTimeout(
resolve,
ms
);

}
);

}


/* ======================
   DEFAULT FRAME
====================== */

let selectedFrame =
"white";

const frames =
document.querySelectorAll(
".frame"
);

frames.forEach(frame=>{

frame.onclick = ()=>{

frames.forEach(f=>{

f.classList.remove(
"active"
);

});

frame.classList.add(
"active"
);

selectedFrame =
frame.dataset.frame;

};

});
   /* ===================================
   QIE PHOTOBOOTH PREMIUM
   PART 3 - RETAKE + EXPORT HD
=================================== */


/* ======================
   RETAKE PER FOTO
====================== */

for(let i=0;i<4;i++){

const box =
document.getElementById(`p${i}`);

box.addEventListener("click",async()=>{

if(
capturedPhotos.length < 4
) return;

const retake =
confirm(
`Retake foto ${i+1}?`
);

if(!retake)
return;

await countdownAnimation();

capturePhoto(i);

});

}


/* ======================
   DOWNLOAD BUTTON
====================== */

const downloadBtn =
document.getElementById(
"downloadBtn"
);

downloadBtn.onclick =
()=>{

if(
capturedPhotos.length < 4
){

alert(
"Ambil 4 foto terlebih dahulu."
);

return;

}

generateFinalPhoto();

};


/* ======================
   GENERATE FINAL
====================== */

function generateFinalPhoto(){

const finalCanvas =
document.getElementById(
"finalCanvas"
);

const ctx =
finalCanvas.getContext(
"2d"
);

/* HD EXPORT */

finalCanvas.width =
3000;

finalCanvas.height =
2250;

const W =
finalCanvas.width;

const H =
finalCanvas.height;


/* ======================
   FRAME BACKGROUND
====================== */

drawFrameBackground(
ctx,
W,
H
);


/* ======================
   LAYOUT 2x2
====================== */

const padding = 170;

const gap = 70;

const photoW =
(W - padding*2 - gap)
/
2;

const photoH =
(H - padding*2 - gap)
/
2;

const positions = [

{
x:padding,
y:padding
},

{
x:
padding +
photoW +
gap,

y:padding
},

{
x:padding,

y:
padding +
photoH +
gap
},

{
x:
padding +
photoW +
gap,

y:
padding +
photoH +
gap
}

];

let loaded = 0;

capturedPhotos.forEach(
(src,index)=>{

const img =
new Image();

img.onload = ()=>{

drawCoverImage(

ctx,

img,

positions[index].x,
positions[index].y,

photoW,
photoH

);

loaded++;

if(
loaded === 4
){

drawWatermark(
ctx,
W,
H
);

downloadFinal(
finalCanvas
);

}

};

img.src = src;

});

}


/* ======================
   FRAME COLORS
====================== */

function drawFrameBackground(
ctx,
W,
H
){

switch(
selectedFrame
){

case "white":

ctx.fillStyle =
"#ffffff";

ctx.fillRect(
0,0,W,H
);

break;


case "black":

ctx.fillStyle =
"#111111";

ctx.fillRect(
0,0,W,H
);

break;


case "maroon":

ctx.fillStyle =
"#641b2e";

ctx.fillRect(
0,0,W,H
);

break;


case "yellow":

ctx.fillStyle =
"#fff4b0";

ctx.fillRect(
0,0,W,H
);

break;


case "polka":

ctx.fillStyle =
"#111111";

ctx.fillRect(
0,0,W,H
);

/* polkadot acak */

for(
let i=0;
i<450;
i++
){

const x =
Math.random()*W;

const y =
Math.random()*H;

const r =
Math.random()*10 + 5;

ctx.beginPath();

ctx.arc(
x,
y,
r,
0,
Math.PI*2
);

ctx.fillStyle =
"white";

ctx.fill();

}

break;

}

}


/* ======================
   NO STRETCH FACE
====================== */

function drawCoverImage(

ctx,
img,

x,
y,

w,
h

){

const scale =
Math.max(

w/img.width,

h/img.height

);

const nw =
img.width *
scale;

const nh =
img.height *
scale;

const dx =
x +
(w-nw)/2;

const dy =
y +
(h-nh)/2;

ctx.drawImage(

img,

dx,
dy,

nw,
nh

);

}


/* ======================
   WATERMARK
====================== */

function drawWatermark(
ctx,
W,
H
){

ctx.save();

ctx.font =
"72px Papyrus";

ctx.fillStyle =
"rgba(255,255,255,.95)";

ctx.textAlign =
"left";

ctx.fillText(

"qiephotobooth",

60,

H-55

);

ctx.restore();

}


/* ======================
   DOWNLOAD PNG
====================== */

function downloadFinal(
canvas
){

const link =
document.createElement(
"a"
);

link.download =
"qiephotobooth.png";

link.href =
canvas.toDataURL(
"image/png",
1
);

link.click();

}


/* ======================
   CLOSE MODAL
====================== */

document
.getElementById(
"frameModal"
)
.addEventListener(
"click",
(e)=>{

if(
e.target.id ===
"frameModal"
){

e.target.style.display =
"none";

}

}
);
   
/* ===================================
   PREMIUM PLUS FEATURES
=================================== */


/* ======================
   PREVIEW BORDER PINK
====================== */

function refreshPreviewBorder(){

for(let i=0;i<4;i++){

const box =
document.getElementById(`p${i}`);

if(capturedPhotos[i]){

box.style.border =
"4px solid #ff69b4";

}

}

}

const oldPreview =
showPreview;

showPreview = function(index,photo){

oldPreview(index,photo);

refreshPreviewBorder();

};


/* ======================
   CONFIRM DOWNLOAD
====================== */

const oldGenerate =
generateFinalPhoto;

generateFinalPhoto = function(){

const ok =
confirm(
"Download photobooth sekarang?"
);

if(!ok)
return;

oldGenerate();

};


/* ======================
   AUTO CLOSE MODAL
====================== */

frames.forEach(frame=>{

frame.addEventListener(
"dblclick",
()=>{

document
.getElementById(
"frameModal"
)
.style.display =
"none";

}
);

});


/* ======================
   POLAROID SHADOW
====================== */

const oldDraw =
drawCoverImage;

drawCoverImage =
function(
ctx,
img,
x,
y,
w,
h
){

ctx.save();

ctx.shadowColor =
"rgba(0,0,0,.15)";

ctx.shadowBlur =
20;

ctx.shadowOffsetY =
8;

oldDraw(
ctx,
img,
x,
y,
w,
h
);

ctx.restore();

};


/* ======================
   EXTRA BEAUTY
====================== */

const oldBeauty =
applyBeauty;

applyBeauty =
function(){

captureCtx.filter =
`
brightness(1.12)
contrast(1.05)
saturate(1.12)
sepia(.03)
`;

};


/* ======================
   RANDOM PINK TONE
====================== */

function addPinkTone(
ctx,
W,
H
){

ctx.save();

ctx.fillStyle =
"rgba(255,120,180,.04)";

ctx.fillRect(
0,
0,
W,
H
);

ctx.restore();

}

const oldWatermark =
drawWatermark;

drawWatermark =
function(
ctx,
W,
H
){

addPinkTone(
ctx,
W,
H
);

oldWatermark(
ctx,
W,
H
);

};


/* ======================
   FINISH MESSAGE
====================== */

setTimeout(()=>{

console.log(
"Qie Photobooth Premium Loaded ✨"
);

},1000);
</script>

</body>
</html>
