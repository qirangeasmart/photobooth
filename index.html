<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>qiephotobooth</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
  body{
    margin:0;
    font-family:Poppins;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg,#fdfbfb,#ebedee,#dfe9f3);
  }

  h1{
    font-size:22px;
    margin:10px;
  }

  video{
    width:280px;
    border-radius:20px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
  }

  .controls{
    margin:10px;
  }

  button, select{
    padding:10px;
    margin:5px;
    border:none;
    border-radius:10px;
    font-weight:600;
  }

  button{
    cursor:pointer;
    background:#111;
    color:white;
  }

  select{
    background:white;
  }

  canvas{display:none;}

  .preview{
    margin-top:10px;
  }

  img{
    width:220px;
    border-radius:10px;
    box-shadow:0 10px 20px rgba(0,0,0,0.15);
  }
</style>
</head>

<body>

<h1>📸 Aesthetic Photobooth</h1>

<video id="video" autoplay></video>

<div class="controls">
  <button onclick="startCam()">Start Camera</button>
  <button onclick="takePhotos()">Take 4 Photos</button>

  <select id="frameStyle">
    <option value="white">Clean White</option>
    <option value="black">Minimal Black</option>
    <option value="polaroid">Polaroid Soft</option>
    <option value="film">Film Grain</option>
  </select>

  <button onclick="download()">Download</button>
</div>

<canvas id="canvas"></canvas>
<canvas id="final"></canvas>

<div class="preview">
  <img id="result"/>
</div>

<script>
let video = document.getElementById("video");
let photos = [];

function startCam(){
  navigator.mediaDevices.getUserMedia({video:true})
  .then(stream => video.srcObject = stream);
}

function snap(){
  let c = document.getElementById("canvas");
  c.width = 300;
  c.height = 300;
  let ctx = c.getContext("2d");

  ctx.drawImage(video,0,0,300,300);
  return c.toDataURL("image/png");
}

async function takePhotos(){
  photos = [];
  for(let i=0;i<4;i++){
    photos.push(snap());
    await new Promise(r=>setTimeout(r,600));
  }
  drawFinal();
}

function drawFinal(){
  let style = document.getElementById("frameStyle").value;
  let c = document.getElementById("final");
  c.width = 300;
  c.height = 600;

  let ctx = c.getContext("2d");

  // background style frame
  if(style==="black") ctx.fillStyle="#111";
  else ctx.fillStyle="#fff";
  ctx.fillRect(0,0,c.width,c.height);

  // spacing
  let size = 140;
  let pad = 10;

  photos.forEach((src,i)=>{
    let img = new Image();
    img.src = src;
    img.onload = ()=>{
      let x = (i%2)*(size+pad)+pad;
      let y = Math.floor(i/2)*(size+pad)+pad;

      ctx.drawImage(img,x,y,size,size);

      // polaroid frame
      if(style==="polaroid"){
        ctx.fillStyle="white";
        ctx.fillRect(x,y,size,size+20);
      }

      // film overlay
      if(style==="film"){
        ctx.fillStyle="rgba(0,0,0,0.2)";
        ctx.fillRect(x,y,size,size);
      }

      document.getElementById("result").src = c.toDataURL();
    }
  });
}

function download(){
  let link = document.createElement("a");
  link.download = "photobooth.png";
  link.href = document.getElementById("final").toDataURL();
  link.click();
}
</script>

</body>
</html>
